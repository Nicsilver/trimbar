name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --workspace
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path target/release/trimbar.exe, target/release/trimbar_hook.dll -DestinationPath trimbar.zip
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" trimbar.zip --title "$GITHUB_REF_NAME" --generate-notes
